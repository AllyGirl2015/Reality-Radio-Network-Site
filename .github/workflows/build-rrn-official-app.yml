name: Build RRN Official Android App

on:
  push:
    branches: [rrn-official-app-v0.10.0]
    paths:
      - 'mobile/rrn_official/**'
      - '.github/workflows/build-rrn-official-app.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create RRN Android project and apply compatibility patches
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/rrn_mobile
          flutter create --platforms=android --org com.rbew --project-name rrn_official /tmp/rrn_mobile
          cp mobile/rrn_official/pubspec.yaml /tmp/rrn_mobile/pubspec.yaml
          rm -rf /tmp/rrn_mobile/lib
          cp -R mobile/rrn_official/lib /tmp/rrn_mobile/lib
          rm -rf /tmp/rrn_mobile/test /tmp/rrn_mobile/analysis_options.yaml

          sed -i 's#package:just_audio_background/just_audio_background.dart#package:audio_service/audio_service.dart#g' \
            /tmp/rrn_mobile/lib/music.dart \
            /tmp/rrn_mobile/lib/tuner.dart

          sed -i "s/'0.3.0'/'0.10.0'/g" /tmp/rrn_mobile/lib/core.dart

          python3 mobile/rrn_official/ci_patch_v060.py
          python3 mobile/rrn_official/ci_patch_v070.py
          python3 mobile/rrn_official/ci_patch_v080.py
          python3 mobile/rrn_official/ci_patch_v090.py
          python3 mobile/rrn_official/ci_patch_v091_fix.py
          sed -i 's/Colors.white45/Colors.white54/g' /tmp/rrn_mobile/lib/tuner_v04.dart
          sed -i "s/'0.9.0'/'0.10.0'/g; s/'buildNumber': 10/'buildNumber': 11/g" /tmp/rrn_mobile/lib/notification_preferences.dart

      - name: Verify station-scoped shared playback bridge
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/rrn_mobile/lib/tuner_v04.dart')
          text = path.read_text()
          old = """      metadata = RadioMetadata.from(body);\n      if (playback.kind == RrnPlaybackKind.station && playback.sourceId == 'station:${_identity(station)}' && station.streamUrl.isNotEmpty) {\n        // Keep playback itself alive; the Dial display is refreshed independently.\n      }\n      if (mounted) setState(() {});"""
          new = """      metadata = RadioMetadata.from(body);\n      playback.updateStationMetadata(station, metadata);\n      if (mounted) setState(() {});"""
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif 'playback.updateStationMetadata(station, metadata);' not in text:
              raise SystemExit('Expected tuner metadata bridge was not found.')
          if "'station': stationKey" not in text:
              raise SystemExit('Station-scoped metadata query is missing.')
          PY

      - name: Generate RRN branding and tuner static
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --quiet pillow
          mkdir -p /tmp/rrn_mobile/assets
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import math, random, struct, wave

          def logo(size):
              im=Image.new('RGB',(size,size),(2,4,10)); d=ImageDraw.Draw(im)
              cx=cy=size/2
              for i,c in enumerate([(0,243,255),(95,110,255),(168,85,247),(236,72,153)]):
                  pad=size*(.055+i*.025)
                  d.ellipse((pad,pad,size-pad,size-pad),outline=c,width=max(2,size//70))
              for n in range(36):
                  a=2*math.pi*n/36-math.pi/2
                  r1=size*.395; r2=size*(.435 if n%3 else .455)
                  d.line((cx+math.cos(a)*r1,cy+math.sin(a)*r1,cx+math.cos(a)*r2,cy+math.sin(a)*r2),fill=(0,243,255) if n<18 else (236,72,153),width=max(1,size//95))
              d.line((cx,size*.18,cx,size*.40),fill=(245,245,255),width=max(3,size//58))
              d.line((cx,size*.21,size*.36,size*.43),fill=(0,243,255),width=max(3,size//70))
              d.line((cx,size*.21,size*.64,size*.43),fill=(236,72,153),width=max(3,size//70))
              for r in (.12,.18,.24):
                  box=(cx-size*r, size*(.10-r*.15), cx+size*r, size*(.37+r*.12))
                  d.arc(box,205,335,fill=(0,243,255),width=max(2,size//75))
              d.rounded_rectangle((size*.14,size*.43,size*.86,size*.72),radius=size*.06,fill=(5,8,18),outline=(168,85,247),width=max(3,size//65))
              try: font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',int(size*.245))
              except: font=ImageFont.load_default()
              b=d.textbbox((0,0),'RRN',font=font); tw=b[2]-b[0]
              d.text(((size-tw)/2,size*.46),'RRN',font=font,fill=(245,247,255),stroke_width=max(1,size//110),stroke_fill=(168,85,247))
              for x in range(int(size*.24),int(size*.76),max(2,size//55)):
                  amp=(.02+.055*abs(math.sin(x/size*math.pi*5)))*size
                  d.line((x,size*.78-amp,x,size*.78+amp),fill=(0,243,255) if x<cx else (236,72,153),width=max(1,size//120))
              return im

          assets=Path('/tmp/rrn_mobile/assets')
          logo(1024).save(assets/'rrn_app_logo.png')
          for bucket,sz in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              p=Path('/tmp/rrn_mobile/android/app/src/main/res')/f'mipmap-{bucket}'
              p.mkdir(parents=True,exist_ok=True)
              logo(sz).save(p/'ic_launcher.png')

          sr=44100; seconds=4; random.seed(2015); samples=[]; prev=0.0
          for _ in range(sr*seconds):
              white=random.uniform(-1,1); prev=.72*prev+.28*white
              value=max(-1,min(1,white*.48+prev*.42)); samples.append(int(value*8500))
          with wave.open(str(assets/'radio_static.wav'),'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              w.writeframes(b''.join(struct.pack('<h',s) for s in samples))
          PY

      - name: Configure persistent Android media surface
        shell: bash
        run: |
          set -euxo pipefail
          cp mobile/rrn_official/android_native/RrnNativeMedia.kt \
            /tmp/rrn_mobile/android/app/src/main/kotlin/com/rbew/rrn_official/MainActivity.kt

          cat >> /tmp/rrn_mobile/android/app/build.gradle.kts <<'EOF'

          dependencies {
              implementation("androidx.media:media:1.7.0")
          }
          EOF

          mkdir -p /tmp/rrn_mobile/android/app/src/main/res/xml
          cat > /tmp/rrn_mobile/android/app/src/main/res/xml/automotive_app_desc.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <automotiveApp><uses name="media" /></automotiveApp>
          EOF

          cat > /tmp/rrn_mobile/android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <application android:label="Reality Radio Network" android:name="${applicationName}" android:icon="@mipmap/ic_launcher" android:usesCleartextTraffic="false">
              <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">
                <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />
                <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
              </activity>
              <service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true" android:stopWithTask="false" tools:ignore="Instantiatable">
                <intent-filter><action android:name="android.media.browse.MediaBrowserService" /></intent-filter>
              </service>
              <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true" tools:ignore="Instantiatable">
                <intent-filter><action android:name="android.intent.action.MEDIA_BUTTON" /></intent-filter>
              </receiver>
              <service android:name=".RrnMediaSurfaceService" android:foregroundServiceType="mediaPlayback" android:exported="false" android:stopWithTask="false" />
              <meta-data android:name="com.google.android.gms.car.application" android:resource="@xml/automotive_app_desc" />
              <meta-data android:name="flutterEmbedding" android:value="2" />
            </application>
          </manifest>
          EOF

      - name: Apply v0.10 launch hardening
        shell: bash
        run: |
          set -euxo pipefail
          python3 mobile/rrn_official/ci_patch_v010.py
          python3 mobile/rrn_official/ci_patch_v010_contract_fix.py
          grep -q "package:file_picker/file_picker.dart" /tmp/rrn_mobile/lib/site.dart
          grep -q "RrnPlayBilling" /tmp/rrn_mobile/lib/points.dart
          grep -q "'uploads': heroImageFile" /tmp/rrn_mobile/lib/feed_composer.dart
          grep -q "loadBoundedArtwork" /tmp/rrn_mobile/android/app/src/main/kotlin/com/rbew/rrn_official/MainActivity.kt

      - name: Resolve packages and validate source
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/rrn_mobile
          flutter pub get
          python3 - <<'PY'
          from pathlib import Path
          candidates = list(Path.home().glob('.pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle'))
          if not candidates:
              raise SystemExit('file_picker Android Gradle file was not found in the pub cache')
          patched = 0
          for path in candidates:
              text = path.read_text()
              next_text = text
              for old, new in [
                  ('compileSdkVersion 34', 'compileSdkVersion 36'),
                  ('compileSdkVersion = 34', 'compileSdkVersion = 36'),
                  ('compileSdk 34', 'compileSdk 36'),
                  ('compileSdk = 34', 'compileSdk = 36'),
              ]:
                  next_text = next_text.replace(old, new)
              if next_text != text:
                  path.write_text(next_text)
                  patched += 1
          if patched == 0:
              print('file_picker does not pin compileSdk 34; no compatibility rewrite required.')
          else:
              print(f'Raised file_picker compileSdk to Android API 36 in {patched} module(s).')
          PY
          dart format lib
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compile installable release APK
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/rrn_mobile
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/RRN-Mobile-0.10.0-Launch-Candidate.apk"
          cp assets/rrn_app_logo.png "$GITHUB_WORKSPACE/RRN-Mobile-0.10.0-App-Logo.png"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RRN-Mobile-0.10.0-Launch-Candidate
          path: |
            RRN-Mobile-0.10.0-Launch-Candidate.apk
            RRN-Mobile-0.10.0-App-Logo.png
          if-no-files-found: error
          retention-days: 90
