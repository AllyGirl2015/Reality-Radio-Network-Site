name: Build RRN Official Android App

on:
  push:
    branches: [rrn-official-app-v0.6.0-media3]
    paths:
      - 'mobile/rrn_official/**'
      - '.github/workflows/build-rrn-official-app.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create RRN Android project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/rrn_mobile
          flutter create --platforms=android --org com.rbew --project-name rrn_official /tmp/rrn_mobile
          cp mobile/rrn_official/pubspec.yaml /tmp/rrn_mobile/pubspec.yaml
          rm -rf /tmp/rrn_mobile/lib
          cp -R mobile/rrn_official/lib /tmp/rrn_mobile/lib
          rm -rf /tmp/rrn_mobile/test /tmp/rrn_mobile/analysis_options.yaml

          # Legacy alpha source files are kept for reference, but only the v0.6
          # screens are wired into main.dart. Keep those files analyzable.
          sed -i 's#package:just_audio_background/just_audio_background.dart#package:audio_service/audio_service.dart#g' \
            /tmp/rrn_mobile/lib/music.dart \
            /tmp/rrn_mobile/lib/tuner.dart

          # Native Media3 owns Android playback in v0.6. Remove AudioService.init
          # from Flutter startup while retaining audio_service Dart value types.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/rrn_mobile/lib/main.dart')
          s=p.read_text()
          s=s.replace("import 'package:audio_service/audio_service.dart';\n",'')
          s=s.replace("import 'audio_handler.dart';\n",'')
          start=s.find('  final mediaHandler = await AudioService.init(')
          end=s.find('  await RrnPlaybackController.instance.attachHandler(mediaHandler);')
          if start < 0 or end < 0:
              raise SystemExit('Expected AudioService startup block was not found.')
          end += len('  await RrnPlaybackController.instance.attachHandler(mediaHandler);')
          s=s[:start] + '  await RrnPlaybackController.instance.init();' + s[end:]
          p.write_text(s)

          # Make the app identify this build correctly to the Matrix.
          core=Path('/tmp/rrn_mobile/lib/core.dart')
          t=core.read_text().replace("'0.3.0'", "'0.6.0'")
          core.write_text(t)

          # v0.6 puts stream controls directly below the selected station and
          # sends live metadata into the same Media3 system session.
          tuner=Path('/tmp/rrn_mobile/lib/tuner_v04.dart')
          t=tuner.read_text()
          if "import 'stream_controls.dart';" not in t:
              t=t.replace("import 'stations.dart';\n", "import 'stations.dart';\nimport 'stream_controls.dart';\n")
          old="""      metadata = RadioMetadata.from(body);\n      if (playback.kind == RrnPlaybackKind.station && playback.sourceId == 'station:${_identity(station)}' && station.streamUrl.isNotEmpty) {\n        // Keep playback itself alive; the Dial display is refreshed independently.\n      }\n      if (mounted) setState(() {});"""
          new="""      metadata = RadioMetadata.from(body);\n      playback.updateStationMetadata(station, metadata);\n      if (mounted) setState(() {});"""
          if old in t:
              t=t.replace(old,new,1)
          elif 'playback.updateStationMetadata(station, metadata);' not in t:
              raise SystemExit('Expected tuner metadata bridge was not found.')
          marker="""          _stationCard(station),\n          const SizedBox(height: 10),\n          _toggles(),"""
          replacement="""          _stationCard(station),\n          const SizedBox(height: 10),\n          RrnStreamControlsCard(\n            station: station,\n            metadata: metadata,\n            volume: volume,\n            onVolumeChanged: _setVolume,\n            onPreviousStation: () => _seekStation(-1),\n            onNextStation: () => _seekStation(1),\n          ),\n          const SizedBox(height: 10),\n          _toggles(),"""
          if marker in t:
              t=t.replace(marker,replacement,1)
          elif 'RrnStreamControlsCard(' not in t:
              raise SystemExit('Expected station-card insertion point was not found.')
          tuner.write_text(t)

          stream=Path('/tmp/rrn_mobile/lib/stream_controls.dart')
          stream.write_text(stream.read_text().replace('value: widget.volume.clamp(0, 1),','value: widget.volume.clamp(0, 1).toDouble(),'))
          PY

      - name: Generate RRN branding and tuner static
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --quiet pillow
          mkdir -p /tmp/rrn_mobile/assets
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import math, random, struct, wave

          def logo(size):
              im=Image.new('RGB',(size,size),(2,4,10)); d=ImageDraw.Draw(im)
              cx=cy=size/2
              for i,c in enumerate([(0,243,255),(95,110,255),(168,85,247),(236,72,153)]):
                  pad=size*(.055+i*.025)
                  d.ellipse((pad,pad,size-pad,size-pad),outline=c,width=max(2,size//70))
              for n in range(36):
                  a=2*math.pi*n/36-math.pi/2
                  r1=size*.395; r2=size*(.435 if n%3 else .455)
                  d.line((cx+math.cos(a)*r1,cy+math.sin(a)*r1,cx+math.cos(a)*r2,cy+math.sin(a)*r2),fill=(0,243,255) if n<18 else (236,72,153),width=max(1,size//95))
              d.line((cx,size*.18,cx,size*.40),fill=(245,245,255),width=max(3,size//58))
              d.line((cx,size*.21,size*.36,size*.43),fill=(0,243,255),width=max(3,size//70))
              d.line((cx,size*.21,size*.64,size*.43),fill=(236,72,153),width=max(3,size//70))
              for r in (.12,.18,.24):
                  box=(cx-size*r, size*(.10-r*.15), cx+size*r, size*(.37+r*.12))
                  d.arc(box,205,335,fill=(0,243,255),width=max(2,size//75))
              d.rounded_rectangle((size*.14,size*.43,size*.86,size*.72),radius=size*.06,fill=(5,8,18),outline=(168,85,247),width=max(3,size//65))
              try: font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',int(size*.245))
              except: font=ImageFont.load_default()
              b=d.textbbox((0,0),'RRN',font=font); tw=b[2]-b[0]
              d.text(((size-tw)/2,size*.46),'RRN',font=font,fill=(245,247,255),stroke_width=max(1,size//110),stroke_fill=(168,85,247))
              for x in range(int(size*.24),int(size*.76),max(2,size//55)):
                  amp=(.02+.055*abs(math.sin(x/size*math.pi*5)))*size
                  d.line((x,size*.78-amp,x,size*.78+amp),fill=(0,243,255) if x<cx else (236,72,153),width=max(1,size//120))
              return im

          assets=Path('/tmp/rrn_mobile/assets')
          logo(1024).save(assets/'rrn_app_logo.png')
          for bucket,sz in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              p=Path('/tmp/rrn_mobile/android/app/src/main/res')/f'mipmap-{bucket}'
              p.mkdir(parents=True,exist_ok=True)
              logo(sz).save(p/'ic_launcher.png')

          sr=44100; seconds=4; random.seed(2015); samples=[]; prev=0.0
          for _ in range(sr*seconds):
              white=random.uniform(-1,1); prev=.72*prev+.28*white
              value=max(-1,min(1,white*.48+prev*.42)); samples.append(int(value*8500))
          with wave.open(str(assets/'radio_static.wav'),'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              w.writeframes(b''.join(struct.pack('<h',s) for s in samples))
          PY

      - name: Install native AndroidX Media3 playback service
        shell: bash
        run: |
          set -euxo pipefail
          KOTLIN=/tmp/rrn_mobile/android/app/src/main/kotlin/com/rbew/rrn_official
          RES=/tmp/rrn_mobile/android/app/src/main/res
          mkdir -p "$KOTLIN" "$RES/drawable" "$RES/xml" "$RES/values"
          cp mobile/rrn_official/native_android/MainActivity.kt "$KOTLIN/MainActivity.kt"
          cp mobile/rrn_official/native_android/RrnMediaService.kt "$KOTLIN/RrnMediaService.kt"
          cp mobile/rrn_official/native_android/AndroidManifest.xml /tmp/rrn_mobile/android/app/src/main/AndroidManifest.xml
          cp mobile/rrn_official/native_android/ic_stat_rrn.xml "$RES/drawable/ic_stat_rrn.xml"

          cat > "$RES/xml/automotive_app_desc.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <automotiveApp><uses name="media" /></automotiveApp>
          EOF

          cat > "$RES/values/rrn_media_strings.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="rrn_playback_channel_name">RRN Playback</string>
          </resources>
          EOF

          cat >> /tmp/rrn_mobile/android/app/build.gradle.kts <<'EOF'

          dependencies {
              implementation("androidx.media3:media3-exoplayer:1.11.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.11.1")
              implementation("androidx.media3:media3-session:1.11.1")
          }
          EOF

      - name: Resolve packages and validate Flutter source
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/rrn_mobile
          flutter pub get
          dart format lib
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compile installable release APK
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/rrn_mobile
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/RRN-Mobile-0.6.0-Media3-Native-Alpha.apk"
          cp assets/rrn_app_logo.png "$GITHUB_WORKSPACE/RRN-Mobile-0.6.0-App-Logo.png"

      - name: Upload APK and logo
        uses: actions/upload-artifact@v4
        with:
          name: RRN-Mobile-0.6.0-Media3-Native-Alpha
          path: |
            RRN-Mobile-0.6.0-Media3-Native-Alpha.apk
            RRN-Mobile-0.6.0-App-Logo.png
          if-no-files-found: error
          retention-days: 90
