name: Build RRN Official Android App v0.13

on:
  push:
    branches: [rrn-official-app-v0.13.0]
    paths:
      - 'mobile/rrn_official/**'
      - '.github/workflows/build-rrn-official-app-v013.yml'
  workflow_dispatch:

concurrency:
  group: rrn-mobile-v013-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build checked-in v0.13 source
        shell: bash
        run: bash mobile/rrn_official/build_android_v013.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RRN-Mobile-0.13.0-Source-First-RC1
          path: |
            RRN-Mobile-0.13.0-Source-First-RC1.apk
            RRN-Mobile-0.13.0-App-Logo.png
          if-no-files-found: error
          retention-days: 90
