name: rrn_official
description: Official Reality Radio Network mobile application.
publish_to: 'none'
version: 0.13.0+14

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.19
  audio_session: ^0.1.21
  file_picker: ^8.1.6
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  in_app_purchase: ^3.2.1
  just_audio: ^0.9.42
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0

flutter:
  uses-material-design: true
  assets:
    - assets/rrn_app_logo.png
    - assets/radio_static.wav
